name: Validate Escapement Standard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository doctor
        run: python scripts/escapement.py doctor

      - name: Self-test (compile, feature list, evals, unit tests, fresh install)
        run: python scripts/escapement.py self-test
