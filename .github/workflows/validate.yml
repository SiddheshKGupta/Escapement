name: Validate Escapement

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Doctor
        run: python scripts/escapement.py doctor --root .
      - name: Security gate
        run: python scripts/security_gate.py --fail-on high
      - name: Router evaluations
        run: |
          python scripts/eval_harness.py clean
          python scripts/eval_harness.py run
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Fresh-install self-test
        run: python scripts/escapement.py self-test
